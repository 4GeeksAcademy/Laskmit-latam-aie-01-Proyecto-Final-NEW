[build-system]
# Backend de empaquetado mínimo para que uv registre scripts del proyecto.
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "nexova-suppliers-api"
version = "0.1.0"
requires-python = ">=3.11"
# Dependencias necesarias para API, validaciones y persistencia TinyDB.
dependencies = [
  "fastapi==0.116.1",
  "uvicorn==0.35.0",
  "python-multipart==0.0.20",
  "tinydb==4.8.2",
  "pydantic[email]==2.11.7",
  "python-jose[cryptography]",
  "libpass[bcrypt]",
  "python-dotenv==1.2.3",
  "resend>=2.0,<3.0",
  "httpx>=0.27,<1.0",
  "sqlmodel>=0.0.42",
  "psycopg2-binary>=2.9.12",
]

[project.scripts]
# Permite correr el seeder como comando: uv run seed
seed = "seed:main"
# Seed de inventario: uv run seed-inventory
seed-inventory = "seed_inventory:seed"

[tool.uv]
# Fuerza modo paquete para instalar entry points definidos arriba.
package = true

[tool.setuptools]
# Módulos sueltos a incluir en el paquete local del servicio.
py-modules = ["seed", "database", "models", "schemas", "main", "seed_inventory"]

# Incluye los paquetes backend para que uv los reconozca.
[tool.setuptools.packages.find]
where = ["."]
include = ["routes*", "auth*", "notifications*", "incidents*", "routers*"]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
]
